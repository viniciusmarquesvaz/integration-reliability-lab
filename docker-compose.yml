name: integration-reliability-lab

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reliability_lab
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "55433:5432"
    volumes:
      - reliability_lab_postgres:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reliability_lab"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: build
    command: npm run db:deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reliability_lab?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runner
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-development-admin-token}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reliability_lab?schema=public
      MAX_PROCESSING_ATTEMPTS: ${MAX_PROCESSING_ATTEMPTS:-3}
      PORT: 3000
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-1000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-development-webhook-secret}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-1000}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      target: runner
    command: node dist/worker-runner.js
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-development-admin-token}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reliability_lab?schema=public
      MAX_PROCESSING_ATTEMPTS: ${MAX_PROCESSING_ATTEMPTS:-3}
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-1000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-development-webhook-secret}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-1000}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  reliability_lab_postgres:
